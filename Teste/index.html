<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMMG - Recrutamento Superior</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #FFD700; --bg: #0f1113; --card-bg: #1c1f22; --text: #e0e0e0; --border: #343a40; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: var(--card-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header { text-align: center; border-bottom: 2px solid var(--primary); padding-bottom: 20px; margin-bottom: 30px; }
        h1 { color: var(--primary); text-transform: uppercase; margin: 0; font-size: 22px; }
        .section-header { color: var(--primary); font-weight: 600; text-transform: uppercase; font-size: 0.8em; margin: 25px 0 10px; border-left: 3px solid var(--primary); padding-left: 10px; background: rgba(255, 215, 0, 0.05); padding: 5px 10px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9em; color: #bbb; font-weight: 600; }
        input, textarea { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid var(--border); background: #121416; color: #fff; margin-bottom: 15px; box-sizing: border-box; font-family: inherit; }
        textarea { height: 80px; resize: vertical; }
        button { width: 100%; padding: 18px; background: var(--primary); color: #000; border: none; border-radius: 6px; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        button:hover { background: #e6c200; transform: translateY(-2px); }
        #adm-panel { display: none; text-align: center; padding: 40px 0; }
        .btn-adm { background: transparent; color: #444; border: 1px solid #333; width: auto; padding: 5px 10px; font-size: 10px; margin-top: 40px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div id="view-candidato">
        <div class="header">
            <h1>Teste de Superior • PMMG</h1>
            <p>Recrutamento via Vercel (Seguro)</p>
        </div>

        <form action="https://formspree.io/f/mlgnanbe" method="POST">
            
            <div class="section-header">Informações Básicas</div>
            <label>1. Idade:</label> <input type="number" name="Idade" required>
            <label>2. Nick no servidor e Id:</label> <input type="text" name="Nick_ID" required>
            <label>3. Tempo total jogando MTA:</label> <input type="text" name="Tempo_MTA" required>
            <label>4. Tempo jogando no Distrito?</label> <input type="text" name="Tempo_Distrito" required>
            <label>5. Horários disponíveis:</label> <textarea name="Horarios" required></textarea>

            <div class="section-header">Histórico e Conduta</div>
            <label>6. Experiência anterior?</label> <textarea name="Experiencia"></textarea>
            <label>8. O que um superior NÃO pode fazer?</label> <textarea name="Regra_Ouro" required></textarea>
            <label>10. Respeitado ou Temido?</label> <textarea name="Perfil" required></textarea>
            <label>25. Cite três qualidades e três defeitos seus:</label> <textarea name="Psicologico" required></textarea>

            <div class="section-header">Ciência</div>
            <label style="display: flex; align-items: center; gap: 10px; font-size: 0.8em;">
                <input type="checkbox" name="Aceite" required style="width: auto;"> Ciente do compromisso e semana de teste.
            </label>

            <button type="submit">Enviar Candidatura</button>
        </form>

        <button class="btn-adm" onclick="entrarAdm()">ADM</button>
    </div>

    <div id="adm-panel">
        <h1>Painel de Comando</h1>
        <p>As respostas chegam direto no seu E-mail e no painel do Formspree.</p>
        <a href="https://formspree.io/forms" target="_blank" style="color:var(--primary); font-weight: bold; text-decoration: none; border: 1px solid var(--primary); padding: 10px 20px; border-radius: 5px; display: inline-block; margin-top: 10px;">VER RESPOSTAS NO FORMSPREE</a>
        <br><br>
        <button onclick="window.location.reload()" style="width: auto; padding: 10px 20px;">Sair</button>
    </div>
</div>

<script>
    function entrarAdm() {
        if (prompt("Digite a senha:") === "parede de senha") {
            document.getElementById('view-candidato').style.display = 'none';
            document.getElementById('adm-panel').style.display = 'block';
        } else { alert("Senha Incorreta!"); }
    }
</script>

</body>
</html>
